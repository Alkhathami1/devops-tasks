# Task 01 — cross-platform SMB mounting, XFS, monitoring and alerting.
#
#   linuxbox    the Linux machine: Samba server, CIFS client, XFS host, and
#               node_exporter running on the machine it monitors
#   prometheus  scrapes node_exporter, evaluates the alert rules, exposes the
#               alerts API the drills read
#
# linuxbox is privileged and uses host networking, and neither is incidental:
#
#   privileged     mounting anything - CIFS or XFS - requires CAP_SYS_ADMIN,
#                  and building an XFS filesystem on a loop device requires
#                  /dev/loop*. There is no way to demonstrate mounting without
#                  it. The cifs kernel module must also already be loaded on
#                  the host; a container cannot modprobe (no /lib/modules).
#   network host   puts Samba on the WSL VM's own interface (172.25.112.x)
#                  instead of behind Docker's NAT. Windows has a route to that
#                  subnet; it has none to a bridge network, so on the default
#                  bridge a Windows client could not reach the share at all.

name: task01

services:
  linuxbox:
    build:
      context: ./linuxbox
      dockerfile: Dockerfile
    image: task01-linuxbox:1.0.0
    container_name: task01-linuxbox
    restart: unless-stopped

    privileged: true
    network_mode: host

    environment:
      SMB_USER: ${SMB_USER:-smbuser}
      SMB_PASSWORD_FILE: /run/secrets/smb_password

    secrets:
      - smb_password

    volumes:
      # The XFS image file persists across restarts, so the filesystem built in
      # the drill is still there afterwards.
      - xfsimages:/var/lib/task01

    healthcheck:
      # Checks the two things this container exists to provide: SMB answering
      # on 445, and node_exporter serving metrics.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 445 && curl -sf http://127.0.0.1:9100/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: task01-prometheus
    restart: unless-stopped
    network_mode: host

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Short retention: a drill instance, not a production TSDB.
      - "--storage.tsdb.retention.time=6h"
      - "--web.enable-lifecycle"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus

    depends_on:
      linuxbox:
        condition: service_healthy

volumes:
  xfsimages:
    name: task01-xfsimages
  promdata:
    name: task01-promdata

secrets:
  smb_password:
    # Generated by scripts/up.sh if absent. Gitignored, never committed.
    file: ./secrets/smb_password.txt
