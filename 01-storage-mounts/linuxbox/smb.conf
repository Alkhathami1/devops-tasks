# Samba configuration for Task 01 — the Linux side of the Linux -> Windows
# direction.
#
# Protocol floor is SMB3. SMB1 is not merely old: it has no encryption, weak
# signing, and is the protocol WannaCry and NotPetya spread over. Windows 10+
# ships with the SMB1 client removed, so there is nothing to gain by allowing
# it and a great deal to lose.

[global]
   workgroup = WORKGROUP
   server string = Task01 Linux SMB server
   security = user
   map to guest = never

   # --- protocol floor -----------------------------------------------------
   # SMB3_11 is SMB 3.1.1: AES-128-GCM encryption, pre-auth integrity hashing
   # (which protects the negotiate exchange itself from downgrade attacks).
   server min protocol = SMB3_11
   server max protocol = SMB3_11
   client min protocol = SMB3_11

   # --- encryption ---------------------------------------------------------
   # "required" means an unencrypted session is refused rather than silently
   # accepted. SMB3 encryption is per-share and negotiated in the session
   # setup, so this is enforced before any file data moves.
   smb encrypt = required

   # --- signing ------------------------------------------------------------
   # Signing prevents an on-path attacker altering requests in flight. It is
   # implied by encryption, but stated explicitly so the intent survives
   # someone relaxing the encryption setting later.
   server signing = mandatory

   # --- multichannel -------------------------------------------------------
   # SMB3 multichannel lets one session use several TCP connections across
   # several NICs, for both throughput and transparent failover. It is enabled
   # here to show the configuration, but this host has a single interface so
   # it cannot actually aggregate anything - stated plainly rather than
   # implied. See the report.
   server multi channel support = yes

   # --- misc ---------------------------------------------------------------
   disable netbios = yes
   smb ports = 445
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

[task01]
   comment = Task 01 export from Linux to Windows
   path = /srv/share
   browseable = yes
   read only = no
   valid users = smbuser
   force user = smbuser
   create mask = 0664
   directory mask = 0775
   # Per-share encryption, belt and braces with the global setting above.
   smb encrypt = required
