# Task 02 — integrated multi-container system on private Docker networks.
#
# Topology (the point of the exercise):
#
#   host :8080 ──► nginx ──edge-net──► backend ──internal-net──► postgres
#                    ▲                                              ▲
#          only published port                        internal: true, no route
#                                                     to or from the host
#
# nginx is the ONLY container that publishes a host port. Postgres is not a
# member of edge-net at all, so it is unreachable from nginx as well as from the
# host — network isolation is enforced by membership, not merely by not
# publishing a port.

name: task02

services:
  postgres:
    image: postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
    container_name: task02-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      # The password is NOT here. It is read from a file-based Docker secret, so
      # it never appears in `docker inspect` output. See the secrets comparison
      # drill for the side-by-side proof.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Deterministic initdb regardless of host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    secrets:
      - postgres_password

    volumes:
      # Named volume, not a bind mount: survives `docker compose down`, and is
      # destroyed only by `down -v`. The persistence drill proves both halves.
      - pgdata:/var/lib/postgresql/data

    networks:
      - internal-net

    # No `ports:` key. Postgres is reachable only from containers that share
    # internal-net, which is the backend and nothing else.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: task02-backend:1.0.0
    container_name: task02-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      # Test affordance for the RAM-exhaustion drill. Reachable only from inside
      # the Docker networks: nginx proxies /api, never /internal.
      CHAOS_ENABLED: ${CHAOS_ENABLED:-true}

    secrets:
      - postgres_password

    networks:
      # The only container on both networks. It is the sole path between the
      # edge and the data tier.
      - edge-net
      - internal-net

    # No `ports:` key. The backend is reachable only through nginx.

    depends_on:
      postgres:
        # Not merely "started". A backend that starts before Postgres is
        # accepting connections is the most common failure in this pattern.
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

    # Prevents the kernel from swapping instead of OOM-killing, which would make
    # the RAM-exhaustion drill inconclusive. Equal to the memory limit = no swap.
    memswap_limit: 256M

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: task02-nginx:1.0.0
    container_name: task02-nginx
    restart: unless-stopped

    ports:
      # The single ingress into the whole system.
      - "${HOST_PORT:-8080}:8080"

    networks:
      # Deliberately NOT on internal-net: nginx cannot reach Postgres even by
      # name. Proven in the isolation checks.
      - edge-net

    depends_on:
      backend:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M

networks:
  edge-net:
    name: task02-edge-net
    driver: bridge

  internal-net:
    name: task02-internal-net
    driver: bridge
    # No gateway to the outside world. Containers here cannot reach the internet
    # and nothing outside Docker can route to them.
    internal: true

volumes:
  pgdata:
    name: task02-pgdata

secrets:
  postgres_password:
    # Generated by scripts/up.sh if absent; gitignored, never committed.
    file: ./secrets/postgres_password.txt
