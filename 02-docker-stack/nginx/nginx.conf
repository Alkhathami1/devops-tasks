worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access log, so proxy evidence can be parsed rather than eyeballed.
    log_format json_combined escape=json
        '{"ts":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"request_time":$request_time}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # The backend is addressed by its compose service name, resolved by Docker's
    # embedded DNS on edge-net. There is no host port involved: nginx is the only
    # container that publishes one.
    upstream backend {
        server backend:3000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Static frontend.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Reverse proxy to the API. Note what is NOT proxied: /internal/* on the
        # backend (the chaos endpoint) has no route here, so it is unreachable
        # from the host even though the backend serves it.
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }

        # Backend health, surfaced through the proxy for the drills. Passes the
        # upstream status through unchanged so a degraded backend reads as 503
        # here too rather than being masked.
        location = /api-health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout    5s;
        }

        # nginx's own liveness, independent of the backend. Used to prove the
        # proxy is up while the backend is deliberately down.
        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }
    }
}
