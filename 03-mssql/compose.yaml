# Task 03 — SQL Server 2022 with automated three-tier backups.
#
#   mssql   the database engine
#   backup  a sidecar that runs the backup schedule and retention
#
# Both share a private network and a backups volume. The database is published
# to the host on 1433 deliberately: unlike Task 02, the point of this task is
# database administration, and the drills drive sqlcmd against the instance.

name: task03

services:
  mssql:
    build:
      context: ./mssql
      dockerfile: Dockerfile
    image: task03-mssql:1.0.0
    container_name: task03-mssql
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      # Developer edition: free for non-production, and feature-complete.
      # Express would cap the buffer pool at 1410 MB and each database at 10 GB.
      MSSQL_PID: ${MSSQL_PID:-Developer}
      # SQL Server's own memory ceiling. MUST stay below the container limit:
      # this caps the buffer pool, and the process needs headroom above it for
      # thread stacks and everything outside the pool. 2048 MB here against a
      # 3 GiB container limit.
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      MSSQL_AGENT_ENABLED: ${MSSQL_AGENT_ENABLED:-true}
      MSSQL_TCP_PORT: "1433"
      # NOTE: MSSQL_SA_PASSWORD is deliberately absent. The entrypoint wrapper
      # reads it from the secret below, so it never enters this configuration
      # and therefore never appears in `docker inspect`.

    secrets:
      - mssql_sa_password

    ports:
      - "${HOST_SQL_PORT:-1433}:1433"

    volumes:
      # A NAMED VOLUME, not a bind mount. The container runs as the
      # unprivileged `mssql` user (uid 10001), and SQL Server insists on owning
      # /var/opt/mssql. A Windows bind mount cannot express that ownership:
      # files surface as root-owned or 777 with no way to chown them, and the
      # engine exits at startup with "Failed to initialize CoreCLR" or a
      # permission error on the data files. A named volume lives inside the
      # Linux VM filesystem where ownership works normally.
      - mssqldata:/var/opt/mssql
      - backups:/backups

    networks:
      - db-net

    deploy:
      resources:
        limits:
          cpus: "2.00"
          # SQL Server refuses to start below 2 GB. 3 GiB gives the engine its
          # 2048 MB ceiling plus roughly 1 GiB of headroom for everything the
          # buffer pool does not cover.
          memory: 3072M
        reservations:
          cpus: "0.50"
          memory: 2048M

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: task03-backup:1.0.0
    container_name: task03-backup
    restart: unless-stopped

    environment:
      SQL_HOST: mssql
      SQL_USER: sa
      DB_NAME: ${DB_NAME:-AppDb}
      BACKUP_DIR: /backups
      FULL_INTERVAL_SEC: ${FULL_INTERVAL_SEC:-3600}
      DIFF_INTERVAL_SEC: ${DIFF_INTERVAL_SEC:-900}
      LOG_INTERVAL_SEC: ${LOG_INTERVAL_SEC:-300}
      RETENTION_INTERVAL_SEC: ${RETENTION_INTERVAL_SEC:-1800}
      FULL_RETENTION_MIN: ${FULL_RETENTION_MIN:-1440}
      DIFF_RETENTION_MIN: ${DIFF_RETENTION_MIN:-360}
      LOG_RETENTION_MIN: ${LOG_RETENTION_MIN:-120}

    secrets:
      - mssql_sa_password

    volumes:
      - backups:/backups

    networks:
      - db-net

    depends_on:
      mssql:
        # Not "started": the engine accepts TCP connections well before it can
        # answer a query, and a backup issued in that window fails.
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

networks:
  db-net:
    name: task03-db-net
    driver: bridge

volumes:
  mssqldata:
    name: task03-mssqldata
  backups:
    name: task03-backups

secrets:
  mssql_sa_password:
    # Generated by scripts/up.sh if absent. Gitignored, never committed.
    file: ./secrets/mssql_sa_password.txt
