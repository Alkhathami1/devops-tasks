[defaults]
inventory            = inventory/hosts.yml
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = default
interpreter_python   = /usr/bin/python3
deprecation_warnings = False
# Facts are gathered once per run; roles below rely on ansible_facts.
gathering            = smart
timeout              = 30

[ssh_connection]
# ControlMaster keeps one SSH connection open per host, which matters here
# because every private host is reached through a ProxyJump and re-establishing
# the jump for each task is slow on a shared-core e2-micro.
# -F /tmp/ssh_config supplies IdentityFile to EVERY hop. Without it the
# key reaches only the final host and each ProxyJump fails to authenticate.
ssh_args      = -F /tmp/ssh_config -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining    = True
