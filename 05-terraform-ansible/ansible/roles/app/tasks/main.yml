---
- name: Install the app runtime
  ansible.builtin.apt:
    name:
      - python3
      - python3-psycopg2
    state: present

- name: Create the service account
  ansible.builtin.user:
    name: appsvc
    system: true
    shell: /usr/sbin/nologin
    home: /opt/app
    create_home: true

- name: Deploy the application
  ansible.builtin.template:
    src: app.py.j2
    dest: /opt/app/app.py
    owner: appsvc
    group: appsvc
    mode: '0755'
  notify: restart app

- name: Deploy the environment file
  # The DB password lives here, mode 0600, not in the unit file - a unit file
  # is world-readable and `systemctl show` prints Environment= values to any
  # user. Same reasoning as the credentials file in Task 01.
  ansible.builtin.template:
    src: app.env.j2
    dest: /opt/app/app.env
    owner: appsvc
    group: appsvc
    mode: '0600'
  notify: restart app
  no_log: true

- name: Install the systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/task05-app.service
    mode: '0644'
  notify:
    - reload systemd
    - restart app

- name: Enable and start the app
  ansible.builtin.systemd:
    name: task05-app
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the app to accept connections
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    host: 0.0.0.0
    timeout: 60
